# golangci-lint configuration
# https://golangci-lint.run/usage/configuration/

version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused

  settings:
    errcheck:
      # Ignore fmt.Fprint* return values - writing to stdout/output rarely fails actionably
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - io.WriteString
        - (io.Closer).Close
        - (*os.File).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*compress/gzip.Reader).Close
        - (*compress/gzip.Writer).Close
        - (*github.com/adewale/rogue_planet/pkg/repository.Repository).Close
        - os.Remove

issues:
  # Don't limit the number of issues per linter
  max-issues-per-linter: 0
  max-same-issues: 0
